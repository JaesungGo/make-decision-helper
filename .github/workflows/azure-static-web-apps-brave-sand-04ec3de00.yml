name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - dev
    paths:
      - 'make-decision-helper-front/**'
      - '.github/workflows/azure-static-web-apps-brave-sand-04ec3de00.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - dev

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'make-decision-helper-front/package-lock.json'

      - name: Clean install dependencies
        run: |
          cd make-decision-helper-front
          npm ci --prefer-offline --no-audit

      - name: Verify dependencies
        run: |
          cd make-decision-helper-front
          npm list vue
          npm list vite

      - name: Build application
        run: |
          cd make-decision-helper-front
          npm run build
        env:
          NODE_ENV: production
          VITE_APP_API_URL: https://halemale-backend-fwhbahdrbggreth5.koreacentral-01.azurewebsites.net
          VITE_WS_URL: wss://halemale-backend-fwhbahdrbggreth5.koreacentral-01.azurewebsites.net
          VITE_APP_API_BASE_PATH: /api
          VITE_NODE_ENV: production

      - name: Verify build output
        run: |
          cd make-decision-helper-front
          ls -la dist/
          find dist/ -name "*.js" | head -5
          echo "Build completed successfully"

      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_SAND_04EC3DE00 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./make-decision-helper-front"
          api_location: ""
          output_location: "dist"
          skip_app_build: true
          skip_api_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_SAND_04EC3DE00 }}
          action: "close"