name: Deploy Spring Boot Backend to Azure

on:
  push:
    branches: [ main, develop ]
    paths: 
      - 'backend/**'          # backend 폴더 변경시에만 실행
      - 'src/**'              # 또는 Spring Boot가 루트에 있는 경우
      - 'pom.xml'             # Maven 설정 변경시
  
  # 수동 실행 옵션
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
  JAVA_VERSION: '17'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 🔄 Checkout repository
      uses: actions/checkout@v4

    - name: ☕ Set up Java ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: 📦 Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-m2-

    - name: 🔨 Build with Maven
      run: |
        # Spring Boot 프로젝트가 backend 폴더에 있는 경우
        if [ -d "backend" ]; then
          cd backend
        fi
        mvn clean package -DskipTests -Dspring.profiles.active=azure
        
    - name: 📋 List build artifacts
      run: |
        if [ -d "backend" ]; then
          ls -la backend/target/
        else
          ls -la target/
        fi

    - name: 🔐 Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: 🚀 Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
        package: |
          ${{ github.workspace }}/backend/target/*.jar
          ${{ github.workspace }}/target/*.jar

    - name: ⚙️ Configure App Settings
      run: |
        az webapp config appsettings set \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --settings MYSQL_PASSWORD="${{ secrets.MYSQL_PASSWORD }}" \
                    SPRING_PROFILES_ACTIVE="azure" \
                    WEBSITES_PORT="8080"

    - name: 🏥 Health Check
      run: |
        echo "Waiting for application to start..."
        sleep 60
        curl -f https://${AZURE_WEBAPP_NAME}.azurewebsites.net/actuator/health || echo "Health check failed, but deployment completed"